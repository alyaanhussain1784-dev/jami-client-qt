name: Build Custom Jami App (Loamaafaanue)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the repository and its nested submodules completely
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Configure Python for Jami's core helper script execution
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Setup the mandatory Qt 6.10 engine required for rendering
    - name: Install Qt 6.10
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.10.0'
        modules: 'qtmultimedia qtwebengine qt5compat'

    # 4. Install native compilation tools and system dependencies
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake automake autoconf autopoint libtool pkg-config \
          libdbus-1-dev libva-dev libvdpau-dev libasound2-dev libpulse-dev \
          libudev-dev libexpat1-dev nasm yasm swig libyaml-cpp-dev \
          libavutil-dev libavcodec-dev libavformat-dev libswscale-dev libavdevice-dev \
          libspeex-dev libspeexdsp-dev libarchive-dev libsecret-1-dev libssl-dev \
          libcanberra-dev glib-2.0 libglib2.0-dev libnotify-dev libgirepository1.0-dev \
          libgnutls28-dev libopus-dev libvpx-dev libx264-dev libupnp-dev \
          libjack-jackd2-dev libqt6svg6-dev doxygen g++ gettext pandoc libnm-dev \
          clang-format

    # 5. Inject your custom app name (Excludes utility .py scripts to prevent corruption)
    - name: Rename App to Loamaafaanue
      run: |
        find . -type f \( -name "CMakeLists.txt" -o -name "*.cpp" -o -name "*.h" -o -name "*.ui" \) -exec sed -i 's/Jami/Loamaafaanue/g' {} +
        find . -type f \( -name "CMakeLists.txt" -o -name "*.cpp" -o -name "*.h" -o -name "*.ui" \) -exec sed -i 's/jami/loamaafaanue/g' {} +

    # 6. Initialize submodules configuration paths using the proper --init flag
    - name: Initialize Jami Build System
      run: |
        chmod +x build.py
        ./build.py --init --qt=$IQT_VERSION_PATH

    # 7. Run the full compilation script for Daemon and Client
    - name: Compile Qt Client & Backend Daemon
      run: |
        ./build.py --install --qt=$IQT_VERSION_PATH

    # 8. Bundle everything into an installable Debian package
    - name: Package as DEB
      run: |
        cd build
        cpack -G DEB

    # 9. Deliver your ready-to-use installer link
    - name: Upload Debian Installer
      uses: actions/upload-artifact@v4
      with:
        name: loamaafaanue-ubuntu-installer
        path: build/*.deb

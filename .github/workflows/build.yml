name: Build Jami Qt Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.3'
        modules: 'qtmultimedia qtwebengine'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake automake autoconf \
          autopoint libtool pkg-config libdbus-1-dev libva-dev libvdpau-dev \
          libasound2-dev libpulse-dev libudev-dev libexpat1-dev nasm yasm swig \
          libyaml-cpp-dev libavutil-dev libspeexdsp-dev libarchive-dev

    - name: Compile Jami Qt & Daemon
      run: |
        chmod +x build.py
        ./build.py --install --qt=\$IQT_VERSION_PATH

    - name: Package as DEB
      run: |
        cd build
        cpack -G DEB

    - name: Upload Debian Installer
      uses: actions/upload-artifact@v4
      with:
        name: jami-qt-ubuntu-installer
        path: build/*.deb
